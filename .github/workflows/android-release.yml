name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
  ANDROID_NDK_VERSION: '25.1.8937393'
  ANDROID_CMAKE_VERSION: '3.22.1'
  ANDROID_API_LEVEL: '26'
  RUST_VERSION: '1.88.0'
  MANUAL_DEPS_DIR: manual-deps

jobs:
  validate:
    name: Release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      application_id: ${{ steps.version.outputs.application_id }}
      apk_name: ${{ steps.version.outputs.apk_name }}
      checksum_name: ${{ steps.version.outputs.checksum_name }}

    steps:
      - name: Enforce main release source
        env:
          RELEASE_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_REF" = "refs/heads/main" || {
            echo "Android releases may only run from refs/heads/main; got $RELEASE_REF" >&2
            exit 1
          }

      - name: Checkout source and tags
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Run CI gate tests
        run: python3 -B -m unittest discover -s ci/test -p 'test_*.py'

      - name: Validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            check-current
            --allow-existing-tag-at-head
            --github-output "$GITHUB_OUTPUT"
            --step-summary "$GITHUB_STEP_SUMMARY"
          )
          if [[ "$EVENT_NAME" == "push" ]]; then
            args+=(--base "$PUSH_BASE_SHA")
          fi
          python3 -B ci/script/release_version.py "${args[@]}"

  build:
    name: Signed Android release
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Initialize terminal submodule
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync -- terminal
          git submodule update --init --recursive --depth 1 terminal
          git submodule status -- terminal

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION" \
            "cmake;$ANDROID_CMAKE_VERSION"

      - name: Restore Android CMake source cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            **/.cxx/operit_deps/*-src
          key: android-cmake-sources-${{ runner.os }}-${{ runner.arch }}-arm64-v8a-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}-${{ hashFiles('cmake/**', '**/CMakeLists.txt', '**/*.cmake', '**/build.gradle.kts', 'gradle.properties') }}

      - name: Restore Android dependency cache
        id: cache-manual-deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.MANUAL_DEPS_DIR }}
          key: android-full-deps-${{ runner.os }}-${{ hashFiles('ci/script/download_android_dependencies.sh', 'ci/script/prepare_android_dependencies.py') }}

      - name: Restore generated STT asset cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: app/build/generated/stt-model-assets
          key: stt-model-assets-${{ runner.os }}-${{ hashFiles('app/config/stt-model-assets.properties') }}

      - name: Download Android dependencies
        if: steps.cache-manual-deps.outputs.cache-hit != 'true'
        run: bash ci/script/download_android_dependencies.sh full "$MANUAL_DEPS_DIR"

      - name: Prepare Android dependencies
        run: |
          python3 ci/script/prepare_android_dependencies.py \
            --profile full \
            --archives "$MANUAL_DEPS_DIR" \
            --repository "$GITHUB_WORKSPACE"

      - name: Restore native ripgrep cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/native_ripgrep/target
          key: native-ripgrep-arm64-${{ runner.os }}-${{ runner.arch }}-ndk-${{ env.ANDROID_NDK_VERSION }}-api-${{ env.ANDROID_API_LEVEL }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('tools/native_ripgrep/Cargo.toml', 'tools/native_ripgrep/Cargo.lock', 'tools/native_ripgrep/**/*.rs', 'tools/native_ripgrep/build_native_ripgrep.ps1') }}

      - name: Build native ripgrep
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${ANDROID_API_LEVEL}-clang"
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup target add --toolchain "$RUST_VERSION" aarch64-linux-android
          cargo "+$RUST_VERSION" build \
            --manifest-path tools/native_ripgrep/Cargo.toml \
            --release \
            --target aarch64-linux-android \
            --locked
          install -Dm755 \
            tools/native_ripgrep/target/aarch64-linux-android/release/liboperit_ripgrep.so \
            app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so
          test -s app/src/main/jniLibs/arm64-v8a/liboperit_ripgrep.so

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install -g pnpm@10.34.5
          npm ci --no-audit --no-fund
          npm --prefix web-chat ci --no-audit --no-fund

      - name: Build generated application assets
        shell: bash
        run: |
          set -euo pipefail
          npm run build:webchat
          npm run build:examples:github
          python3 tools/example_packages/sync_example_packages.py --no-hot-reload

      - name: Configure dedicated release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MINIBILE_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MINIBILE_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINIBILE_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MINIBILE_RELEASE_KEY_PASSWORD }}
          SECRET_CERT_SHA256: ${{ secrets.MINIBILE_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD SECRET_CERT_SHA256; do
            test -n "${!name}" || { echo "Required signing secret is empty: $name" >&2; exit 1; }
          done
          repository_cert_sha256="$(tr -d '[:space:]' < ci/release-certificate-sha256.txt)"
          test "$SECRET_CERT_SHA256" = "$repository_cert_sha256" || {
            echo "Signing certificate secret does not match ci/release-certificate-sha256.txt" >&2
            exit 1
          }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/minibile-release.jks"
          test -s "$RUNNER_TEMP/minibile-release.jks"
          {
            printf 'sdk.dir=%s\n' "$ANDROID_HOME"
            printf 'RELEASE_STORE_FILE=%s\n' "$RUNNER_TEMP/minibile-release.jks"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > local.properties
          chmod 600 local.properties "$RUNNER_TEMP/minibile-release.jks"

      - name: Run JVM tests and build signed Release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace --no-daemon

      - name: Verify signed Release APK
        env:
          APK_NAME: ${{ needs.validate.outputs.apk_name }}
          CHECKSUM_NAME: ${{ needs.validate.outputs.checksum_name }}
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/$APK_NAME"
          checksum="app/build/outputs/apk/release/$CHECKSUM_NAME"
          python3 -B ci/script/verify_release_artifact.py \
            --root "$GITHUB_WORKSPACE" \
            --apk "$apk" \
            --checksum "$checksum" \
            --certificate-sha256 ci/release-certificate-sha256.txt \
            --aapt "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION/apksigner" \
            --write-checksum

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: minibile-android-reports-${{ github.run_number }}
          path: |
            app/build/reports/**
            build/reports/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verified release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: minibile-release-${{ needs.validate.outputs.version }}
          path: |
            app/build/outputs/apk/release/${{ needs.validate.outputs.apk_name }}
            app/build/outputs/apk/release/${{ needs.validate.outputs.checksum_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f local.properties "$RUNNER_TEMP/minibile-release.jks"

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout source and tags
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Download verified release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: minibile-release-${{ needs.validate.outputs.version }}
          path: release-artifacts

      - name: Revalidate version and downloaded assets
        env:
          APK_NAME: ${{ needs.validate.outputs.apk_name }}
          CHECKSUM_NAME: ${{ needs.validate.outputs.checksum_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B ci/script/release_version.py check-current --allow-existing-tag-at-head
          cd release-artifacts
          test -s "$APK_NAME"
          test -s "$CHECKSUM_NAME"
          sha256sum --check --strict "$CHECKSUM_NAME"

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ needs.validate.outputs.apk_name }}
          CHECKSUM_NAME: ${{ needs.validate.outputs.checksum_name }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          python3 -B ci/script/release_version.py release-notes --output "$notes_file"
          python3 -B ci/script/publish_github_release.py \
            --root "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --notes-file "$notes_file" \
            --asset "release-artifacts/$APK_NAME" \
            --asset "release-artifacts/$CHECKSUM_NAME"